[package]
name = "spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Steg 0: whisper-rs + NB-Whisper + symphonia/rubato. Ikke en del av appen."

# Egen arbeidsflate, ikke en del av appens bygg.
[workspace]

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
rubato = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16" }

[profile.release]
debug = false
