[project]
name = "jv-ocr"
version = "0.1.1"
description = "Gjør skannede PDF-er og bilder søkbare med OCR (ocrmypdf, norsk og engelsk)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "ocrmypdf>=16",
    "pikepdf>=10,<10.14",  # 10.14+ har bare hjul for macOS 15 (arm64); 10.13.0.post1 er siste med hjul for macOS 14. Se docs/senere.md
    "pymupdf>=1.24,<2",  # 2.0 drar inn onnxruntime, numpy, pymupdf-layout og pymupdf4llm (regel 7). Se docs/senere.md
]

[project.entry-points."jv.tools"]
ocr = "jv_ocr.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
