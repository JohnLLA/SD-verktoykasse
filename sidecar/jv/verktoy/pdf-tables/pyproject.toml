[project]
name = "jv-pdf-tables"
version = "0.1.0"
description = "Hent tabeller fra PDF-er til regneark (XLSX/CSV) med norske tall"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
]

[project.entry-points."jv.tools"]
pdf-tables = "jv_pdf_tables.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
