[project]
name = "jv-redact"
version = "0.1.1"
description = "Ekte sladding av personopplysninger i PDF (fødselsnummer, telefon, e-post, egne termer)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "pymupdf>=1.24,<2",  # 2.0 drar inn onnxruntime, numpy, pymupdf-layout og pymupdf4llm (regel 7). Se docs/senere.md
]

[project.entry-points."jv.tools"]
redact = "jv_redact.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
