[project]
name = "jv-datawrapper"
version = "0.1.1"
description = "Klargjør tabeller fra Excel og CSV for Datawrapper"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[project.entry-points."jv.tools"]
datawrapper = "jv_datawrapper.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
