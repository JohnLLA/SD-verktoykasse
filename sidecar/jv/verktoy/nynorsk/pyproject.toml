[project]
name = "jv-nynorsk"
version = "0.2.1"
description = "Førsteutkast på den andre målformen (bokmål ↔ nynorsk) med Apertium, for txt, md og docx"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "python-docx>=1.1",
]

[project.entry-points."jv.tools"]
nynorsk = "jv_nynorsk.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
