[project]
name = "jv-compare"
version = "0.1.0"
description = "Sammenlign to versjoner av et dokument (txt, md, docx, pdf) og få en HTML-rapport"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jv-common",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.entry-points."jv.tools"]
compare = "jv_compare.cli:main"

[tool.uv.sources]
jv-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"
