<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f7fc6"/>
      <stop offset=".55" stop-color="#0b5c9c"/>
      <stop offset="1" stop-color="#123a60"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="160" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#04203f" flood-opacity=".35"/>
    </filter>
    <!-- Open-end wrench, drawn horizontally around (0,0) -->
    <mask id="wrenchCut" maskUnits="userSpaceOnUse" x="-400" y="-200" width="800" height="400">
      <rect x="-400" y="-200" width="800" height="400" fill="#fff"/>
      <g transform="translate(262 0) rotate(-15)"><rect x="-6" y="-31" width="140" height="62" rx="6" fill="#000"/></g>
      <g transform="translate(-262 0) rotate(195)"><rect x="-6" y="-31" width="140" height="62" rx="6" fill="#000"/></g>
    </mask>
  </defs>

  <!-- macOS icon grid: 824 x 824 body on a 1024 canvas -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <defs>
    <mask id="gapAroundFeather" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path transform="translate(518 446) rotate(-45)" d="M-170 6 C-122 -86 40 -142 314 -50 C254 16 100 98 -170 6 Z" fill="#000" stroke="#000" stroke-width="26" stroke-linejoin="round"/>
      <path transform="translate(518 446) rotate(-45)" d="M-292 20 L-168 7" stroke="#000" stroke-width="41" stroke-linecap="round"/>
    </mask>
    <mask id="featherCuts" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <g transform="translate(518 446) rotate(-45)" fill="#000">
        <path d="M-30 -95 L5 -102 L-56 -35 Z M130 -101 L165 -96 L104 -41 Z M41 55 L75 55 L15 3 Z"/>
        <path d="M-158 6 C0 0 150 -18 288 -42" fill="none" stroke="#000" stroke-width="11" stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <g filter="url(#glyphShadow)" fill="#fff" transform="translate(512 426) scale(0.84) translate(-512 -450)">
    <g mask="url(#gapAroundFeather)">
      <g transform="translate(512 452) rotate(45)">
        <g mask="url(#wrenchCut)">
          <rect x="-262" y="-33" width="524" height="66" rx="14"/>
          <circle cx="-262" cy="0" r="84"/>
          <circle cx="262" cy="0" r="84"/>
        </g>
      </g>
    </g>
    <g mask="url(#featherCuts)">
      <path transform="translate(518 446) rotate(-45)" d="M-170 6 C-122 -86 40 -142 314 -50 C254 16 100 98 -170 6 Z"/>
      <path transform="translate(518 446) rotate(-45)" d="M-292 20 L-168 7" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="#fff"><path transform="translate(388.33 828) scale(0.08859 -0.08859)" d="M675 -24C1042 -24 1266 153 1266 440C1266 664 1125 795 807 862L664 893C481 933 407 984 407 1076C407 1185 514 1261 666 1261C826 1261 931 1174 942 1033H1230C1221 1333 1008 1514 665 1514C326 1514 99 1332 99 1061C99 848 242 711 537 647L694 613C883 572 961 516 961 420C961 304 848 229 677 229C486 229 371 325 367 489H70C70 165 293 -24 675 -24Z"/><path transform="translate(508.46 828) scale(0.08859 -0.08859)" d="M637 0C1094 0 1373 287 1373 746C1373 1203 1091 1490 643 1490H111V0ZM419 259V1231H624C920 1231 1063 1059 1063 746C1063 432 922 259 621 259Z"/></g>
